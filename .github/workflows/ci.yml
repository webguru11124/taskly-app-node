name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The unit-test agent dispatches this workflow after it pushes verified
  # tests, because pushes made with GITHUB_TOKEN don't trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node ../tools/test-agent/coverage-summary.mjs backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node ../tools/test-agent/coverage-summary.mjs frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  test-agent-tooling:
    name: Test agent tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Unit tests for the plan, policy, verification and reporting scripts
        run: node --test "tools/test-agent/test/*.test.mjs"
      - name: Validate JSON configuration
        run: |
          node -e 'for (const f of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(f, "utf8"))' \
            package.json tools/test-agent/claude-settings.json tools/test-agent/agent-report.schema.json
